services:
  app:
    build: .
    image: communication-system
    container_name: communication-system
    # Reachable only via the shared nginx-proxy (communication-system.zetac.de); no public host port.
    env_file:
      - .env
    environment:
      # SQLite file lives on the app-data volume
      DATABASE_URL: file:/app/data/app.db
      UPLOAD_DIR: /app/uploads
      APP_URL: https://communication-system.zetac.de
      COOKIE_SECURE: "true"
      # Register with the shared nginx-proxy + acme-companion for HTTPS
      VIRTUAL_HOST: communication-system.zetac.de
      VIRTUAL_PORT: "3000"
      LETSENCRYPT_HOST: communication-system.zetac.de
      LETSENCRYPT_EMAIL: info@zetac.de
    volumes:
      - app-data:/app/data
      - app-uploads:/app/uploads
    networks:
      - default
      - proxy
    restart: unless-stopped

networks:
  # default: implicit per-stack bridge
  default:
  # shared reverse-proxy network, created/owned by /root/reverse-proxy
  proxy:
    external: true

volumes:
  app-data:
  app-uploads:
